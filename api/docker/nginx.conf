server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16M;

    # Fichiers statiques (images, uploads, etc.) servis directement si presents
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # CRUCIAL : Toutes les requetes .php sont transmises a index.php (routeur Laravel)
    # Dans cette application, les routes d'API se terminent par .php (/api/auth/login.php, /api/gammes/list.php, etc.)
    # Elles n'existent pas sous forme de fichiers physiques. Les router vers /index.php
    # permet a Laravel de les traiter sans renvoyer de 404 par FastCGI.
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;

        # Transmission du protocole HTTPS depuis le reverse proxy Railway
        set $fe_https "off";
        if ($http_x_forwarded_proto = "https") {
            set $fe_https "on";
        }
        fastcgi_param HTTPS $fe_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Securite : interdire l'acces aux fichiers caches (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Envoi des logs sur stdout/stderr pour qu'ils soient visibles sur Railway
    access_log /dev/stdout;
    error_log /dev/stderr;
}
